name: Build SK-H724G OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-skh724g.yml'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git subversion wget curl ca-certificates \
            libncurses5-dev zlib1g-dev bison flex unzip xz-utils file patch sed m4 \
            autoconf automake libtool pkg-config libc6:i386 zlib1g:i386

      - name: Fetch pinned Realtek SDK source
        run: |
          git clone https://github.com/cgoder/openwrt_rtk.git src
          cd src
          git checkout d237e45ee480ee7e75c80a4c61e1a335a0a77755

      - name: Apply SK-H724G and modern-host fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          root=Path('src/rtk_openwrt_sdk')
          def rep(rel, old, new, required=True):
              p=root/rel
              s=p.read_text()
              if old not in s:
                  if required:
                      print('WARN missing pattern', rel, repr(old[:80]))
                  return
              p.write_text(s.replace(old,new))

          # Hardware: SK-H724G RTL8198C + RTL8192EE + RTL8814AE
          p=root/'target/linux/rtkmips/rtl8198c/config-3.10'
          s=p.read_text()
          s=s.replace('# CONFIG_SLOT_0_8192EE is not set\nCONFIG_SLOT_0_8194AE=y',
                      'CONFIG_SLOT_0_8192EE=y\n# CONFIG_SLOT_0_8194AE is not set')
          if 'CONFIG_WLAN_HAL_8192EE=y' not in s:
              s=s.replace('CONFIG_WLAN_HAL=y\n','CONFIG_WLAN_HAL=y\nCONFIG_WLAN_HAL_8192EE=y\n')
          p.write_text(s)

          p=root/'target/linux/rtkmips/image/Makefile'
          s=p.read_text().replace('ttyS0,38400','ttyS0,115200').replace('0x80500000','0x81000000')
          p.write_text(s)

          # Do not inject old staging host libraries into modern /bin/sh.
          p=root/'include/toplevel.mk'
          s=p.read_text()
          s=s.replace('export LD_LIBRARY_PATH:=$(subst ::,:,$(if $(LD_LIBRARY_PATH),$(LD_LIBRARY_PATH):)$(STAGING_DIR_HOST)/lib)','export LD_LIBRARY_PATH:=')
          s=s.replace('export DYLD_LIBRARY_PATH:=$(subst ::,:,$(if $(DYLD_LIBRARY_PATH),$(DYLD_LIBRARY_PATH):)$(STAGING_DIR_HOST)/lib)','export DYLD_LIBRARY_PATH:=')
          p.write_text(s)

          # Build only packages required by the known RTL8198C configuration.
          p=root/'package/Makefile'
          s=p.read_text()
          old='$(curdir)/builddirs:=$(sort $(package-) $(package-y) $(package-m))'
          new='$(curdir)/builddirs:=base-files firmware/linux-firmware kernel/fastpath kernel/linux kernel/mac80211 kernel/rtl_fs kernel/rtl_nf kernel/rtl_sendfile libs/cyassl libs/gettext libs/gmp libs/libiconv libs/libjson-c libs/libnl-tiny libs/libpcap libs/libtool libs/libubox libs/lzo libs/ncurses libs/nettle libs/ocf-crypto-headers libs/openssl libs/polarssl libs/toolchain libs/ustream-ssl libs/zlib network/config/firewall network/config/netifd network/ipv6/odhcp6c network/services/dnsmasq network/services/dropbear network/services/hostapd network/services/igmpproxy network/services/odhcpd network/services/ppp network/services/uhttpd network/utils/iptables network/utils/iw network/utils/iwinfo network/utils/linux-atm network/utils/resolveip network/utils/wireless-tools system/fstools system/mtd system/opkg system/procd system/ubox system/ubus system/uci utils/busybox utils/jsonfilter utils/lua utils/rtk_app utils/ubi-utils utils/util-linux'
          s=s.replace(old,new)
          p.write_text(s)

          # Replace dead git:// and nbd.name sources used by selected packages.
          replacements={
          'package/libs/librpc/Makefile':('git://nbd.name/uclibc-rpc.git','https://github.com/openwrt/uclibc-rpc.git'),
          'package/libs/ustream-ssl/Makefile':('git://nbd.name/ustream-ssl.git','https://github.com/openwrt/ustream-ssl.git'),
          'package/network/config/firewall/Makefile':('git://nbd.name/firewall3.git','https://github.com/openwrt/firewall3.git'),
          'package/network/ipv6/odhcp6c/Makefile':('git://github.com/sbyx/odhcp6c.git','https://github.com/sbyx/odhcp6c.git'),
          'package/network/services/hostapd/Makefile':('git://w1.fi/srv/git/hostap.git','https://w1.fi/hostap.git'),
          'package/network/services/odhcpd/Makefile':('git://github.com/sbyx/odhcpd.git','https://github.com/sbyx/odhcpd.git'),
          'package/network/services/relayd/Makefile':('git://nbd.name/relayd.git','https://github.com/openwrt/relayd.git'),
          'package/network/services/uhttpd/Makefile':('git://nbd.name/uhttpd2.git','https://git.openwrt.org/project/uhttpd.git'),
          'package/system/fstools/Makefile':('git://nbd.name/fstools.git','https://github.com/openwrt/fstools.git'),
          'package/system/procd/Makefile':('git://nbd.name/luci2/procd.git','https://github.com/openwrt/procd.git'),
          'package/system/ubox/Makefile':('git://nbd.name/luci2/ubox.git','https://github.com/openwrt/ubox.git'),
          'package/system/ubus/Makefile':('git://nbd.name/luci2/ubus.git','https://github.com/openwrt/ubus.git'),
          'package/system/uci/Makefile':('git://nbd.name/uci.git','https://github.com/openwrt/uci.git'),
          'tools/mtd-utils/Makefile':('git://git.infradead.org/mtd-utils.git','https://git.infradead.org/mtd-utils.git'),
          }
          for rel,(a,b) in replacements.items(): rep(rel,a,b,False)

          # Avoid unconditional ath10k firmware fetch when not selected.
          p=root/'package/kernel/mac80211/Makefile'
          s=p.read_text()
          s=s.replace('$(eval $(call Download,ath10k-firmware))','ifneq ($(CONFIG_PACKAGE_kmod-ath10k),)\n$(eval $(call Download,ath10k-firmware))\nendif',1)
          s=s.replace('\t$(TAR) -C $(PKG_BUILD_DIR) -xjf $(DL_DIR)/$(PKG_ATH10K_LINUX_FIRMWARE_SOURCE)',
                      'ifneq ($(CONFIG_PACKAGE_kmod-ath10k),)\n\t$(TAR) -C $(PKG_BUILD_DIR) -xjf $(DL_DIR)/$(PKG_ATH10K_LINUX_FIRMWARE_SOURCE)\nendif',1)
          p.write_text(s)

          # Old GCC host build needs old C++ language mode on modern compilers.
          p=root/'toolchain/gcc/common.mk'
          s=p.read_text()
          needle='\t\tCFLAGS="$(HOST_CFLAGS)" \\\n'
          if 'CXXFLAGS="-O1 -std=gnu++98"' not in s and needle in s:
              s=s.replace(needle,needle+'\t\tCXXFLAGS="-O1 -std=gnu++98" \\\n',1)
          p.write_text(s)
          PY

      - name: Install exact Realtek Lexra RSDK
        run: |
          cd src/rtk_openwrt_sdk
          mkdir -p staging_dir
          curl -fL --retry 5 --retry-delay 3 \
            https://github.com/bol-van/build/raw/refs/heads/master/rsdk-4.6.4-5281-EB-3.10-0.9.33-m32ub-20141001.txz \
            -o /tmp/rsdk.txz
          tar -xJf /tmp/rsdk.txz -C staging_dir
          find staging_dir -maxdepth 3 -type f -name '*gcc' | head -20

      - name: Configure RTL8198C
        run: |
          cd src/rtk_openwrt_sdk
          cp rtk_deconfig/defconfig_rtl8198c .config
          yes '' | make oldconfig || true
          grep -E 'CONFIG_TARGET_rtkmips_rtl8198c|CONFIG_PACKAGE_kmod-rtl8192cd' .config | head -20
          grep -E 'CONFIG_SLOT_0_8192EE|CONFIG_SLOT_0_8194AE|CONFIG_SLOT_1_8814AE|CONFIG_WLAN_HAL_8192EE' target/linux/rtkmips/rtl8198c/config-3.10
          grep -n '0x81000000' target/linux/rtkmips/image/Makefile

      - name: Build firmware
        run: |
          cd src/rtk_openwrt_sdk
          set -o pipefail
          make -j2 V=s 2>&1 | tee build-skh724g.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p artifact
          find src/rtk_openwrt_sdk/bin -type f -maxdepth 6 -print -exec cp -v {} artifact/ \; 2>/dev/null || true
          cp -v src/rtk_openwrt_sdk/build-skh724g.log artifact/ 2>/dev/null || true
          sha256sum artifact/* > artifact/SHA256SUMS.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SK-H724G-OpenWrt-build
          path: artifact/
          if-no-files-found: warn
