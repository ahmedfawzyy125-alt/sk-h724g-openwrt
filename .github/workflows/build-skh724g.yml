name: Build SK-H724G OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-skh724g.yml'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git subversion wget curl ca-certificates \
            libncurses5-dev zlib1g-dev bison flex unzip xz-utils file patch sed m4 \
            autoconf automake libtool pkg-config libc6:i386 zlib1g:i386

      - name: Fetch pinned Realtek SDK source
        run: |
          git clone https://github.com/cgoder/openwrt_rtk.git src
          cd src
          git checkout d237e45ee480ee7e75c80a4c61e1a335a0a77755

      - name: Apply SK-H724G and modern-host fixes
        run: |
          python3 scripts/patch_sdk.py
          python3 scripts/patch_superchannel.py
          cp scripts/findutils-system.mk src/rtk_openwrt_sdk/tools/findutils/Makefile
          cp scripts/m4-system.mk src/rtk_openwrt_sdk/tools/m4/Makefile
          python3 scripts/fix_bison.py
          python3 scripts/fix_mklibs_makefile.py
          echo '--- persistent mklibs Host/Prepare patch ---'
          grep -n -A12 -B3 'define Host/Prepare' src/rtk_openwrt_sdk/tools/mklibs/Makefile

      - name: Verify superchannel patch
        run: |
          grep -n 'MAX_CHANNEL_NUM' src/rtk_openwrt_sdk/target/linux/rtkmips/files/drivers/net/wireless/rtl8192cd/8192cd_cfg.h | head
          grep -n '5M10M' src/rtk_openwrt_sdk/target/linux/rtkmips/files/drivers/net/wireless/rtl8192cd/8192cd_util.c | head
          grep -n 'SKH724G_SUPERCHANNEL_MAP' src/rtk_openwrt_sdk/target/linux/rtkmips/files/drivers/net/wireless/rtl8192cd/8192cd_comapi.c

      - name: Install exact Realtek Lexra RSDK
        run: |
          cd src/rtk_openwrt_sdk
          mkdir -p staging_dir
          curl -fL --retry 5 --retry-delay 3 \
            https://github.com/bol-van/build/raw/refs/heads/master/rsdk-4.6.4-5281-EB-3.10-0.9.33-m32ub-20141001.txz \
            -o /tmp/rsdk.txz
          tar -xJf /tmp/rsdk.txz -C staging_dir
          find staging_dir -maxdepth 3 -type f -name '*gcc' | head -20

      - name: Configure RTL8198C
        run: |
          cd src/rtk_openwrt_sdk
          cp rtk_deconfig/defconfig_rtl8198c .config
          yes '' | make oldconfig || true
          grep -E 'CONFIG_TARGET_rtkmips_rtl8198c|CONFIG_PACKAGE_kmod-rtl8192cd' .config | head -20
          grep -E 'CONFIG_SLOT_0_8192EE|CONFIG_SLOT_0_8194AE|CONFIG_SLOT_1_8814AE|CONFIG_WLAN_HAL_8192EE' target/linux/rtkmips/rtl8198c/config-3.10
          grep -n '0x81000000' target/linux/rtkmips/image/Makefile

      - name: Build firmware
        run: |
          cd src/rtk_openwrt_sdk
          mkdir -p build_dir/host/firmware-utils/bin
          set -o pipefail
          make -j1 V=s 2>&1 | tee build-skh724g.log

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p artifact
          find src/rtk_openwrt_sdk/bin -maxdepth 6 -type f -print -exec cp -v {} artifact/ \; 2>/dev/null || true
          cp -v src/rtk_openwrt_sdk/build-skh724g.log artifact/ 2>/dev/null || true
          sha256sum artifact/* > artifact/SHA256SUMS.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SK-H724G-OpenWrt-build
          path: artifact/
          if-no-files-found: warn
