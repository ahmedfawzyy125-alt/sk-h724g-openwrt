name: Build SK-H724G OpenWrt

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - '.github/workflows/build-skh724g.yml'
      - 'scripts/**'

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y build-essential gawk git subversion wget curl ca-certificates \
            libncurses5-dev zlib1g-dev bison flex unzip xz-utils file patch sed m4 scons squashfs-tools \
            autoconf automake libtool pkg-config libc6:i386 zlib1g:i386

      - name: Fetch pinned Realtek SDK source
        run: |
          git clone https://github.com/cgoder/openwrt_rtk.git src
          cd src
          git checkout d237e45ee480ee7e75c80a4c61e1a335a0a77755

      - name: Apply SK-H724G and modern-host fixes
        run: |
          python3 scripts/patch_sdk.py
          python3 scripts/patch_connectivity.py
          python3 scripts/patch_superchannel.py
          cp scripts/findutils-system.mk src/rtk_openwrt_sdk/tools/findutils/Makefile
          cp scripts/m4-system.mk src/rtk_openwrt_sdk/tools/m4/Makefile
          cp scripts/scons-system.mk src/rtk_openwrt_sdk/tools/scons/Makefile
          python3 scripts/fix_bison.py
          python3 scripts/fix_mklibs_makefile.py
          cp scripts/cmake-2.8-modern-gcc.patch src/rtk_openwrt_sdk/tools/cmake/patches/998-modern-gcc-const-comparator.patch

          cat > src/rtk_openwrt_sdk/tools/e2fsprogs/patches/999-modern-glibc-sysmacros.patch <<'PATCH'
          --- a/lib/blkid/devname.c
          +++ b/lib/blkid/devname.c
          @@ -22,6 +22,9 @@
           #if HAVE_SYS_TYPES_H
           #include <sys/types.h>
           #endif
          +#if defined(__linux__)
          +#include <sys/sysmacros.h>
          +#endif
           #include <dirent.h>
           #if HAVE_SYS_STAT_H
           #include <sys/stat.h>
          PATCH

          sed -i '/^HOST_CFLAGS += -I$(STAGING_DIR_HOST)\/include\/e2fsprogs$/a HOST_CFLAGS += -include sys/sysmacros.h\nHOST_CFLAGS += -Dllseek=lseek' \
            src/rtk_openwrt_sdk/tools/mtd-utils/Makefile

          sed -i 's#EXTRA_CFLAGS="-I$(STAGING_DIR_HOST)/include"#EXTRA_CFLAGS="-I$(STAGING_DIR_HOST)/include -include sys/sysmacros.h"#' \
            src/rtk_openwrt_sdk/tools/squashfs4/Makefile

          sed -i '/--without-included-gettext \\/a\		--without-python \\' \
            src/rtk_openwrt_sdk/toolchain/gdb/Makefile

      - name: Verify superchannel and connectivity patches
        run: |
          grep -n 'MAX_CHANNEL_NUM' src/rtk_openwrt_sdk/target/linux/rtkmips/files/drivers/net/wireless/rtl8192cd/8192cd_cfg.h | head
          grep -n '5M10M' src/rtk_openwrt_sdk/target/linux/rtkmips/files/drivers/net/wireless/rtl8192cd/8192cd_util.c | head
          grep -n 'SKH724G_SUPERCHANNEL_MAP' src/rtk_openwrt_sdk/target/linux/rtkmips/files/drivers/net/wireless/rtl8192cd/8192cd_comapi.c
          test -x src/rtk_openwrt_sdk/target/linux/rtkmips/base-files/etc/init.d/skh724g-connectivity
          test -x src/rtk_openwrt_sdk/target/linux/rtkmips/base-files/etc/uci-defaults/99-skh724g-connectivity-late
          grep -q 'modprobe rtl8192cd' src/rtk_openwrt_sdk/target/linux/rtkmips/base-files/etc/init.d/skh724g-connectivity
          grep -q 'rtk_txcalr -w' src/rtk_openwrt_sdk/target/linux/rtkmips/base-files/etc/init.d/skh724g-connectivity

      - name: Install exact Realtek Lexra RSDK
        run: |
          cd src/rtk_openwrt_sdk
          mkdir -p staging_dir
          curl -fL --retry 5 --retry-delay 3 \
            https://github.com/bol-van/build/raw/refs/heads/master/rsdk-4.6.4-5281-EB-3.10-0.9.33-m32ub-20141001.txz \
            -o /tmp/rsdk.txz
          tar -xJf /tmp/rsdk.txz -C staging_dir

      - name: Pin LuCI compatible with this SDK
        run: |
          rm -rf /tmp/luci-012
          git clone --branch luci-0.12 --single-branch https://github.com/openwrt/luci.git /tmp/luci-012
          git -C /tmp/luci-012 checkout 0d510b28203d33c6969ae5549f37f8b39811dd2e
          mkdir -p src/rtk_openwrt_sdk/package/luci
          sed 's|^LUCI_TOPDIR=.*|LUCI_TOPDIR=/tmp/luci-012|' /tmp/luci-012/contrib/package/luci/Makefile > src/rtk_openwrt_sdk/package/luci/Makefile
          python3 - <<'PY'
          from pathlib import Path
          p = Path('src/rtk_openwrt_sdk/package/luci/Makefile')
          s = p.read_text()
          old = '$(foreach b,$(LUCI_BUILD_PACKAGES),$(eval $(call BuildPackage,$(b))))'
          selected = 'luci luci-base luci-lib-nixio luci-mod-admin-full luci-theme-bootstrap luci-app-firewall luci-proto-ppp'
          new = '$(foreach b,$(filter ' + selected + ',$(LUCI_BUILD_PACKAGES)),$(eval $(call BuildPackage,$(b))))'
          if old in s:
              s = s.replace(old, new)
          p.write_text(s)
          PY

      - name: Configure RTL8198C and LuCI
        run: |
          cd src/rtk_openwrt_sdk
          cp rtk_deconfig/defconfig_rtl8198c .config
          cat >> .config <<'CONFIG'
          CONFIG_PACKAGE_luci=y
          CONFIG_PACKAGE_luci-base=y
          CONFIG_PACKAGE_luci-base_source=y
          CONFIG_PACKAGE_luci-mod-admin-full=y
          CONFIG_PACKAGE_luci-theme-bootstrap=y
          CONFIG_PACKAGE_luci-app-firewall=y
          CONFIG_PACKAGE_luci-proto-ppp=y
          CONFIG_PACKAGE_luci-lib-nixio=y
          CONFIG_PACKAGE_luci-lib-nixio_notls=y
          CONFIG_PACKAGE_lua=y
          CONFIG_PACKAGE_libuci-lua=y
          CONFIG_PACKAGE_libubus-lua=y
          CONFIG_PACKAGE_libiwinfo-lua=y
          CONFIG_PACKAGE_uhttpd=y
          CONFIG_PACKAGE_uhttpd-mod-ubus=y
          CONFIG
          yes '' | make oldconfig || true
          grep -E 'CONFIG_TARGET_rtkmips_rtl8198c|CONFIG_PACKAGE_kmod-rtl8192cd|CONFIG_PACKAGE_rtk_app|CONFIG_PACKAGE_luci=|CONFIG_PACKAGE_uhttpd=' .config | head -30
          grep -E 'CONFIG_SLOT_0_8192EE|CONFIG_SLOT_0_8194AE|CONFIG_SLOT_1_8814AE|CONFIG_WLAN_HAL_8192EE' target/linux/rtkmips/rtl8198c/config-3.10
          grep -n '0x81000000' target/linux/rtkmips/image/Makefile

      - name: Build firmware
        run: |
          cd src/rtk_openwrt_sdk
          mkdir -p build_dir/host/firmware-utils/bin
          set -o pipefail
          make -j1 V=s 2>&1 | tee build-skh724g.log

      - name: Validate firmware against working upgrade baseline
        run: |
          python3 scripts/validate_firmware.py
          ROOT=$(find src/rtk_openwrt_sdk/build_dir -type d -path '*/root-rtkmips' | head -1)
          test -n "$ROOT"
          test -f "$ROOT/www/cgi-bin/luci"
          test -f "$ROOT/usr/lib/lua/luci/dispatcher.lua"
          test -f "$ROOT/etc/config/uhttpd"
          mkdir -p "$ROOT/www"
          cat > "$ROOT/www/index.html" <<'HTML'
          <!doctype html><html><head><meta http-equiv="refresh" content="0;url=/cgi-bin/luci"></head><body><a href="/cgi-bin/luci">Open LuCI</a></body></html>
          HTML

      - name: Collect outputs
        if: always()
        run: |
          mkdir -p artifact
          find src/rtk_openwrt_sdk/bin -maxdepth 6 -type f -print -exec cp -v {} artifact/ \; 2>/dev/null || true
          cp -v src/rtk_openwrt_sdk/build-skh724g.log artifact/ 2>/dev/null || true
          sha256sum artifact/* > artifact/SHA256SUMS.txt 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: SK-H724G-OpenWrt-build
          path: artifact/
          if-no-files-found: warn
